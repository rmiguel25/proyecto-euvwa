# Desarrollo Seguro de Aplicaciones
#Actividad 2 – Pipeline DevSecOps sobre euVWA
#Alumno: Raúl Miguel FernandesPipeline DevSecOps para euVWA
# La idea es automatizar controles básicos de seguridad cada vez que se sube código al repositorio.

name: DevSecOps Pipeline

# Se ejecuta automáticamente cuando hago push
# a las ramas principales del proyecto.
on:
  push:
    branches:
      - main
      - master
      - main-secure

jobs:

  security-pipeline:

    # GitHub crea una máquina Ubuntu temporal
    # donde se ejecutan todas las herramientas.
    runs-on: ubuntu-latest

    steps:

      # Descarga el repositorio actual.
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # Instalación de Node.js.
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Instalación de dependencias del proyecto.
      - name: Instalar dependencias
        run: npm install

      # Análisis estático básico usando ESLint.
      # El "|| true" evita que el pipeline se detenga
      # aunque aparezcan warnings.
      - name: Ejecutar ESLint Security
        run: |
          npm install eslint eslint-plugin-security --save-dev
          npx eslint . || true

      # Semgrep busca patrones inseguros
      # directamente en el código fuente.
      - name: Ejecutar Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/security-audit"
      # Con esto le decimos que aunque encuentre fallos, no rompa el pipeline
        continue-on-error: true

      # Construcción de la imagen Docker.
      - name: Construir imagen Docker
        run: docker build -t euvwa .

      # Escaneo de vulnerabilidades
      # sobre archivos y dependencias.
      - name: Escaneo Trivy Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      # Escaneo de vulnerabilidades
      # dentro de la imagen Docker.
      - name: Escaneo Trivy Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: euvwa

      # Arranque temporal del contenedor
      # Le añadimos un comando para ver los logs y comprobar que no ha petado.
      - name: Ejecutar aplicación
        run: |
          docker run -d -p 3000:3000 --name euvwa-container euvwa
          sleep 20
          echo "=== LOGS DEL CONTENEDOR ==="
          docker logs euvwa-container

      # Averiguamos la IP interna del contenedor en la máquina de GitHub
      # y la guardamos en una variable de entorno.
      - name: Obtener IP del contenedor
        run: |
          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' euvwa-container)
          echo "APP_IP=$CONTAINER_IP" >> $GITHUB_ENV
          echo "La IP de euVWA es: $CONTAINER_IP"

      # Arreglamos permisos por el error "[Errno 13] Permission denied" que te salía en el log
      - name: Dar permisos a la carpeta
        run: chmod -R 777 .

      # Escaneo DAST básico con OWASP ZAP.
      # Ahora usamos la IP real en vez de localhost.
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://${{ env.APP_IP }}:3000