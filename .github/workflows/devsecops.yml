# Desarrollo Seguro de Aplicaciones
# Actividad 2 – Pipeline DevSecOps sobre euVWA
# Alumno: Raúl Miguel Fernández
# La idea de este workflow es automatizar
# controles básicos de seguridad cada vez
# que se sube código al repositorio.

name: DevSecOps Pipeline

# El pipeline se ejecuta automáticamente
# cuando hacemos push a las ramas principales.
on:
  push:
    branches:
      - main
      - master
      - main-secure

jobs:

  security-pipeline:

    # GitHub levanta una máquina Ubuntu temporal
    # donde se ejecutan todos los pasos.
    runs-on: ubuntu-latest

    steps:

      # Descarga el contenido actual del repositorio.
      - name: Clonar repositorio
        uses: actions/checkout@v4


      # Instalación del entorno Node.js.
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Instalación de dependencias del proyecto.
      - name: Instalar dependencias
        run: npm install

      # ESLint ayuda a detectar errores
      # y patrones inseguros básicos.
      # Aunque encuentre warnings,
      # el pipeline continúa.
      - name: Ejecutar ESLint Security
        run: |
          npm install eslint eslint-plugin-security --save-dev
          npx eslint . || true

      # Semgrep realiza análisis SAST
      # buscando vulnerabilidades comunes
      # directamente en el código fuente.
      - name: Ejecutar Semgrep
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: "p/security-audit"

      # Construcción de la imagen Docker.
      - name: Construir imagen Docker
        run: docker build -t euvwa .

      # Escaneo de vulnerabilidades sobre
      # archivos y dependencias del proyecto.
      - name: Escaneo Trivy Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
      
          # Generación automática del SBOM
      # para inventario de dependencias.
      - name: Generar SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json

      # Escaneo de vulnerabilidades
      # dentro de la imagen Docker.
      - name: Escaneo Trivy Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: euvwa

      # Arranque temporal del contenedor
      # para realizar pruebas dinámicas.
      - name: Ejecutar aplicación
        run: |

          # Eliminamos el contenedor anterior
          # para evitar conflictos entre ejecuciones.
          docker rm -f euvwa-container 2>/dev/null || true

          # Arranque del contenedor vulnerable.
          docker run -d -p 3000:3000 --name euvwa-container euvwa

          # Espera corta para el arranque.
          sleep 5

          echo "=== Logs del contenedor ==="

          # Mostramos logs para comprobar
          # si el contenedor falla al iniciar.
          docker logs euvwa-container

          echo "=== Contenedores activos ==="

          docker ps -a

          # Espera adicional antes del DAST.
          sleep 15

      # Comprobación básica de conectividad.
      # Aunque falle, el pipeline continúa
      # para poder revisar logs posteriores.
      - name: Verificar que la app está activa
        continue-on-error: true
        run: |
          curl -v http://localhost:3000

      # Obtener la IP del runner para que
      # OWASP ZAP pueda alcanzar la aplicación.
      - name: Obtener IP del runner
        id: get-ip
        run: echo "runner_ip=$(hostname -I | awk '{print $1}')" >> $GITHUB_OUTPUT

      # Dar permisos al workspace para que
      # ZAP pueda generar reportes.
      - name: Ajustar permisos para ZAP
        run: chmod a+w ${{ github.workspace }}

      # Escaneo DAST básico usando OWASP ZAP.
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: http://${{ steps.get-ip.outputs.runner_ip }}:3000
          allow_issue_writing: false